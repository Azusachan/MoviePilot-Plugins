name: Sync upstream through a merge PR

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: cloudsubscribefork-plex-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open PR and merge upstream history
        id: prepare
        run: bash .github/scripts/prepare-upstream-pr.sh
      - name: Validate fork and derive version
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_plex_patch.py
          python3 .github/scripts/apply_mikan_patch.py
          python3 .github/scripts/set_commit_version.py "$UPSTREAM_SHA"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: validate fork integration and version for ${UPSTREAM_SHA:0:12}"
          fi
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "CHECK_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/statuses/$(git rev-parse HEAD)" \
            -f state=pending -f context=upstream-sync/validation \
            -f target_url="$RUN_URL" -f description='Testing merged upstream and fork'
      - name: Test backend
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install beautifulsoup4
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q plugins.v2/cloudsubscribefork
          python3 .github/scripts/get_plugin_meta.py >/dev/null
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          INPUT_SOURCE_DIRECTORY: plugins.v2
          INPUT_PLUGIN_ID: CloudSubscribeFork
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          node-version: "22"
      - name: Test frontend build
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm --dir frontend/cloudsubscribefork install --frozen-lockfile
          pnpm --dir frontend/cloudsubscribefork build
          test -f plugins.v2/cloudsubscribefork/dist/assets/remoteEntry.js
      - name: Merge tested PR with a merge commit
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo 'main changed during validation; rerun to merge and retest it.' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/statuses/$CHECK_SHA" \
            -f state=success -f context=upstream-sync/validation \
            -f target_url="$RUN_URL" -f description='Backend tests and frontend build passed'
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$CHECK_SHA"
          test "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = MERGED
          gh pr comment "$PR_NUMBER" --body "Validation passed; merged with a merge commit. Build: $RUN_URL"
          # Explicit dispatch: do not rely on a GITHUB_TOKEN push event.
          gh workflow run plugins-release.yml --ref main \
            -f source_directory=plugins.v2 -f plugin_id=CloudSubscribeFork
      - name: Record failure on the PR
        if: ${{ failure() && env.PR_NUMBER != '' }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          gh api "repos/$GH_REPO/statuses/$head" \
            -f state=failure -f context=upstream-sync/validation \
            -f target_url="$RUN_URL" -f description='Sync blocked; inspect conflicts or failed validation'
          gh pr comment "$PR_NUMBER" --body "Automatic sync stopped. Do not merge this PR until upstream-sync/validation succeeds. No conflict was auto-resolved. Inspect the conflict or permission comment, resolve on this branch, then rerun: $RUN_URL"
